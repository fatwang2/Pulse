name: Bug report
description: Report a problem in a Pulse edition.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Pulse edition
      options:
        - Claude Code plugin
        - Omarchy edition
        - Current commercial Mac app
        - Historical free Mac app
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Versions and environment
      description: Include the Pulse version, OS, and Claude Code or Omarchy version when relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs or diagnostics
      description: Remove credentials and private financial information. For Mac, use More → Feedback → Copy Diagnostics Report if available.
      render: text
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Remove private information before sharing.
