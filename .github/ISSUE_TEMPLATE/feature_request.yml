name: Feature request
description: Suggest a feature for a Pulse edition.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: edition
    attributes:
      label: Pulse edition
      multiple: true
      options:
        - Claude Code plugin
        - Omarchy edition
        - Current commercial Mac app
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or workflow this would help with.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Pulse to do?
  - type: textarea
    id: context
    attributes:
      label: Additional context
