# The one place Pulse is built, signed, notarized, and published.
#
# Two things make this the only publisher. `scripts/release-mac.sh` uploads
# only when PULSE_RELEASE_UPLOAD=1 on a real Actions runner, and the signing
# identity and the Sparkle key live here as repository secrets rather than on
# anyone's Mac. Running the same script locally builds and verifies identical
# artifacts and stops before publishing, so a laptop can rehearse a release but
# never ship one.
#
# The job runs in the `release` environment, which requires a human approval
# before any step starts. That gate is what stands between a compromised
# workflow and a Sparkle-signed update: Sparkle's EdDSA key has no revocation
# path, and its public half is already baked into every installed copy of
# Pulse, so a signed malicious update would be accepted by all of them.
#
# Required repository secrets:
#   CSC_LINK            base64 of the Developer ID Application .p12
#   CSC_KEY_PASSWORD    password of that .p12 (set both from the same export)
#   APPLE_API_KEY_P8    contents of the App Store Connect API key .p8
#   APPLE_API_KEY_ID    key id of that API key
#   APPLE_API_ISSUER    issuer id of that API key
#   SPARKLE_PRIVATE_KEY exported EdDSA key (generate_keys -x)
#   TELEMETRYDECK_APP_ID  optional; analytics are disabled when absent

name: Release macOS

on:
  workflow_call:
    inputs:
      publish:
        description: "Upload the Release and the appcast (false builds and verifies only)"
        required: false
        type: boolean
        default: true
      require_new_release:
        description: "Refuse a version that is already fully released"
        required: false
        type: boolean
        default: true

env:
  # Public halves of the update feed. They are compiled into the app, so they
  # must match .env.release.example and the shipped Info.plist: an app that
  # ships one public key cannot verify an appcast signed by another key.
  SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/download/appcast/appcast.xml
  SPARKLE_PUBLIC_ED_KEY: SEERlHb3nTm1HQjbHoxeWmIED6ZVjRRsAo8Ez1lJ8V8=

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-26
    # Approval gate. Named environments carry the reviewer rule, so this is
    # also where a reviewer sees which run is asking to sign an update.
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The compiler is part of what ships, so it is pinned rather than
      # inherited: the image's default Xcode moves without warning, and a
      # release should record exactly what built it. Bump this deliberately
      # after checking the build still compiles — the macos-26 image lists its
      # installed Xcodes in actions/runner-images.
      - name: Select Xcode 26.6
        run: |
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "$XCODE" ]; then
            echo "::error::$XCODE is gone from this image; pick another from /Applications and update this step" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$XCODE"

      - name: Report the toolchain
        run: |
          xcodebuild -version
          swift --version

      # A version that is already released must not be rebuilt: its assets are
      # what installed copies verified against the appcast, and replacing them
      # would break the signature check for anyone mid-download. Asking before
      # the build costs seconds; noticing after notarization costs an hour.
      - name: Refuse a version that is already released
        if: ${{ inputs.require_new_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-status.mjs check

      # Pinned rather than `brew install`: the project file this generates is
      # the input to every later step, so its generator is part of the build.
      - name: Install XcodeGen 2.45.4
        run: |
          curl --fail --silent --show-error --location \
            -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          BIN="$(dirname "$(find "$RUNNER_TEMP/xcodegen" -name xcodegen -type f -perm -u+x | head -1)")"
          echo "$BIN" >> "$GITHUB_PATH"
          "$BIN/xcodegen" --version

      # Two caches, both of which can only ever skip work that would have
      # produced identical output. The Rust one is keyed on the plugin script,
      # which pins the SDK version, commit and patch, and the build itself
      # re-checks that stamp before skipping. Compiled Swift is deliberately
      # not cached: a stale object file in a release is a binary that does not
      # match its source, which costs more than the ten minutes it saves.
      - name: Restore the Longbridge SDK build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/longbridge-sdk
            .cache/cargo-target
          key: longbridge-${{ runner.os }}-${{ hashFiles('scripts/build-longbridge-plugin.sh') }}
          restore-keys: longbridge-${{ runner.os }}-

      - name: Restore resolved Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Pulse.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'project.yml') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # The Longbridge plugin is a Rust library built once per architecture and
      # lipo'd together, and a release build is universal. The image ships only
      # the host target, so the second one has to be added explicitly.
      - name: Install the Rust targets the Longbridge plugin needs
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed

      # The certificate is the source of truth for who signs: the identity and
      # the team id are read back out of it rather than configured twice.
      - name: Import the Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::CSC_LINK and CSC_KEY_PASSWORD must both be set, from the same .p12 export" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(/usr/bin/uuidgen)"
          P12="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Notarization waits can outlast the default five-minute auto-lock,
          # and a locked keychain fails the DMG signature at the very end.
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$P12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild 2>"$RUNNER_TEMP/import.log"; then
            cat "$RUNNER_TEMP/import.log" >&2
            echo "::error::could not import the .p12. A MAC verification failure means CSC_LINK and CSC_KEY_PASSWORD are from different exports" >&2
            exit 1
          fi
          # Without a partition list the first codesign call blocks on a UI
          # prompt that a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$P12"
          IDENTITY="$(security find-identity -p codesigning -v "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::the .p12 carries no Developer ID Application identity" >&2
            exit 1
          fi
          TEAM="$(printf '%s' "$IDENTITY" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')"
          if [ -z "$TEAM" ]; then
            echo "::error::could not read the team id out of: $IDENTITY" >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "DEVELOPMENT_TEAM=$TEAM" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "signing as $IDENTITY"

      - name: Install the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_API_KEY_P8 secret is not set" >&2
            exit 1
          fi
          # Outside the workspace, so no later step can sweep it into an
          # artifact, and gone with the runner either way.
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY"
          chmod 600 "$KEY"
          echo "APPLE_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and publish
        env:
          PULSE_RELEASE_UPLOAD: ${{ inputs.publish && '1' || '0' }}
          PULSE_CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TELEMETRYDECK_APP_ID: ${{ secrets.TELEMETRYDECK_APP_ID }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set; the appcast would be unsigned and every installed Pulse would reject the update" >&2
            exit 1
          fi
          bash scripts/release-mac.sh

      # The upload is not the finish line: what matters is that a shipped app
      # polling the feed now sees this version. Assert it from outside.
      - name: Verify the published feed
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A just-uploaded asset can take a moment to be served, so one miss
          # here means "not yet", not "broken".
          for attempt in 1 2 3 4 5; do
            node scripts/release-status.mjs status | tee "$RUNNER_TEMP/status.txt"
            if grep -qx "released=true" "$RUNNER_TEMP/status.txt"; then
              exit 0
            fi
            echo "not visible yet (attempt $attempt); retrying in 15s"
            sleep 15
          done
          echo "::error::the release did not come out complete; see the line above for what is missing" >&2
          exit 1

      # The site serves the DMG from its own R2 mirror, and that Worker refuses
      # to cache bytes whose size and checksum do not match what the repository
      # says. Both are properties of the artifact this run just built, so the
      # run records them instead of leaving a hash for someone to transcribe
      # into a follow-up commit after every release.
      - name: Point the website's download mirror at this release
        if: ${{ inputs.publish }}
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          DMG="$(ls build/release/dist/Pulse-*.dmg | head -1)"
          if [ ! -f "$DMG" ]; then
            echo "::error::no DMG in build/release/dist to describe" >&2
            exit 1
          fi
          node scripts/update-download-mirror.mjs "$DMG"
          if git diff --quiet -- website/src/download.ts; then
            echo "the mirror already points at this release"
            exit 0
          fi
          VERSION="${DMG##*/Pulse-}"
          VERSION="${VERSION%.dmg}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/download.ts
          git commit -m "website: Pulse $VERSION download"
          # main can move while a release builds; rebase onto it rather than
          # force anything on top of someone else's commit.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Keep the artifacts with the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: release-artifacts
          if-no-files-found: ignore
          path: |
            build/release/dist/*.dmg
            build/release/dist/*.zip
            build/release/appcast/appcast.xml

      - name: Remove the signing keychain
        if: ${{ always() }}
        run: |
          security list-keychains -d user -s login.keychain-db || true
          if [ -n "${RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$RELEASE_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
