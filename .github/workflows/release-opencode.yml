name: Release Pulse for opencode

# Push a tag opencode-v<version> (matching opencode/package.json) to publish
# opencode-pulse-ticker to npm and create a GitHub release.
on:
  push:
    tags: ["opencode-v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    if: github.repository == 'fatwang2/Pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm # add required reviewers on this environment to approve each publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./opencode/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "opencode-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match opencode/package.json version ${version}" >&2
            exit 1
          fi
      - name: Test
        run: make test-herdr test-opencode
      - name: Install build tools
        # Babel and Solid's preset compile src/ to dist/ (npm runs the build on prepack).
        working-directory: opencode
        run: npm ci --no-audit --no-fund
      - name: Publish to npm
        # Authenticates with npm trusted publishing (OIDC); no token is stored anywhere.
        # Skips a version that is already on npm.
        working-directory: opencode
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "Pulse for opencode ${GITHUB_REF_NAME#opencode-v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
