name: Release Pulse for Rex

# Push a tag rex-v<version> (matching rex/package.json) to publish
# rex-pulse-ticker to npm and create a GitHub release.
on:
  push:
    tags: ["rex-v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    if: github.repository == 'fatwang2/Pulse'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm # add required reviewers on this environment to approve each publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./rex/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "rex-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match rex/package.json version ${version}" >&2
            exit 1
          fi
      - name: Test
        run: make test-herdr test-rex
      - name: Publish to npm
        # Authenticates with npm trusted publishing (OIDC); no token is stored anywhere.
        # Skips a version that is already on npm. No build step: the package is the source.
        working-directory: rex
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published; skipping."
          else
            npm publish --access public --provenance
          fi
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "Pulse for Rex ${GITHUB_REF_NAME#rex-v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
